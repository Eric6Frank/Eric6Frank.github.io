<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="canonical" href="{{ '/' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ '/' | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/academicons.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/homepage.css' | relative_url }}">
  <script defer src="{{ '/assets/js/homepage.js' | relative_url }}"></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include masthead.html %}
  <div class="site-shell">
    {% include author-profile.html %}
    <main id="main">{{ content }}</main>
  </div>
  {% include footer.html %}
</body>
</html>
